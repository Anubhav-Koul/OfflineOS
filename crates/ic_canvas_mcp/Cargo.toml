[package]
name = "ic_canvas_mcp"
version = "0.1.0"
edition = "2024"
publish = false
description = "In-process canvas render tool for the IronClaw desktop app: an MCP server on loopback that hands agent-authored HTML/SVG to the widget for sandboxed rendering."

[lib]
path = "src/lib.rs"

[dependencies]
# The MCP transport. Same major version the gateway and the browser sidecar use.
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt", "sync"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[lints]
workspace = true
