[package]
name = "ic_integration_tests"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
publish = false
description = "Phase 0 upstream-merge gate: spawns `ironclaw-reborn serve` and drives a full chat round-trip over the WebChat v2 API against a hermetic mock LLM."

[features]
# Compile the serve round-trip gate test. Off by default so a plain
# `cargo test --workspace` (which does not build the beta `serve` binary)
# does not fail for a missing `ironclaw-reborn` binary.
#
# CI enables this AND pre-builds the binary in the same invocation:
#   cargo build -p ironclaw_reborn_cli --bin ironclaw-reborn --features webui-v2-beta
#   cargo test  -p ic_integration_tests                       --features webui-v2-beta
#
# The test locates the binary under the target dir; override with
# IRONCLAW_REBORN_BIN=<path> if it lives elsewhere.
#
# It also switches on the same feature in `ironclaw_webui_v2`, because
# `tests/routeless_surfaces.rs` reads that crate's route table and the table
# itself is compiled behind the flag.
webui-v2-beta = ["ironclaw_webui_v2/webui-v2-beta"]

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
futures-util = "0.3"

[dev-dependencies]
# Used only by `tests/local_model_roundtrip.rs`, which is `#[ignore]`d and needs
# a real GGUF on disk. The harness in `src/lib.rs` does not depend on llama.cpp.
ic_llama = { path = "../ic_llama" }

# `tests/connector_oauth.rs` — the product-auth OAuth start route demands an
# `expires_at` on the flow, so the test has to be able to say what time it is.
chrono = "0.4"

# `tests/browser_mcp_contract.rs` — the Phase 4 gate. It drives the real browser
# sidecar over HTTP and feeds its `tools/list` through the runtime's own
# discovery code, so the core crates are dev-dependencies here on purpose: the
# test must fail if IronClaw would refuse our manifest, not if our own
# expectations of it drift.
ic_browser_mcp = { path = "../ic_browser_mcp" }
ic_canvas_mcp = { path = "../ic_canvas_mcp" }
# `tests/ambient_surfacing.rs` — the Phase 7a gate. It drives the widget's *own*
# ambient watcher over a real trigger fire on a real gateway, so a change in where
# a fired run lands fails here rather than in a user's face. The lib builds without
# Tauri (the `app` feature is off), so this costs no WebView.
ic_widget = { path = "../ic_widget" }
ironclaw_extensions = { path = "../ironclaw_extensions" }
ironclaw_host_api = { path = "../ironclaw_host_api" }
# For `default_host_port_catalog()` — the same catalog the runtime validates
# manifests against, so the test cannot pass against a stub the real thing rejects.
ironclaw_host_runtime = { path = "../ironclaw_host_runtime" }
# `tests/skill_parser_agreement.rs` — the Phase 8e gate. The widget's importer
# has to accept exactly what the runtime installs, so the test feeds one corpus
# to both parsers and compares. Depending on the real one is the whole point.
ironclaw_skills = { path = "../ironclaw_skills" }
# `tests/routeless_surfaces.rs` — the tripwire for the three dashboard panels
# that have no backend. It reads the runtime's *own* route table rather than a
# copy of it, so the day upstream adds a memory / audit / run route this fails
# instead of the dashboard going on saying "unavailable" forever.
ironclaw_webui_v2 = { path = "../ironclaw_webui_v2" }
# `tests/channels_verify.rs` — the Phase 8f canary. It calls the real Telegram
# adapter's parser to pin that it refuses anything without host-verified webhook
# evidence, which is what makes it webhook-only rather than long-polling.
#
# `test-support` is what lets the test mint the verified evidence a *host*
# would, so it can show the same payload parses fine once the webhook has been
# verified — the refusal is about the missing webhook, not a malformed payload.
# The feature is documented upstream as one downstream crates enable from
# `[dev-dependencies]`, which is exactly what this is.
ironclaw_product_adapters = { path = "../ironclaw_product_adapters", features = [
    "test-support",
] }
ironclaw_telegram_v2_adapter = { path = "../ironclaw_telegram_v2_adapter" }
async-trait = "0.1"
