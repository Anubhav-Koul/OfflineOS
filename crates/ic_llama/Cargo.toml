[package]
name = "ic_llama"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
publish = false
description = "Phase 1 of the desktop fork: manages a pinned llama.cpp `llama-server` sidecar and its GGUF models, and hands IronClaw an `openai_compatible` endpoint to talk to it."

[dependencies]
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-native-roots",
    "stream",
] }
futures-util = "0.3"
# The schema-sanitizing proxy in `proxy.rs`. All three already appear in the
# workspace lockfile as reqwest's own dependencies.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4.3"
thiserror = "2"
tracing = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_System_SystemInformation",
] }

[dev-dependencies]
tempfile = "3"

# A stand-in for `llama-server` that `tests/sidecar_supervision.rs` spawns as a
# real subprocess. It has to be a `[[bin]]` rather than an example, because only
# bin targets get a `CARGO_BIN_EXE_*` path handed to integration tests. The
# explicit `path` keeps it out of `tests/`, where cargo would also try to run it
# as a test.
[[bin]]
name = "ic_llama_fake_server"
path = "testsupport/fake_llama_server.rs"
test = false
doc = false

[lints]
workspace = true
