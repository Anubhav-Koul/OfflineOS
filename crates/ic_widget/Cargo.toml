[package]
name = "ic_widget"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
publish = false
description = "Phase 2 of the desktop fork: the Tauri widget + dashboard, and the one client module the rest of the app talks to `ironclaw-reborn serve` through."

[lib]
name = "ic_widget"
path = "src/lib.rs"

[[bin]]
name = "ic-widget"
path = "src/main.rs"
# The Tauri shell is heavy to compile and needs WebView2. Everything worth
# testing (the gateway client, the supervisor, window state) lives in the lib and
# builds without it, so `cargo test -p ic_widget` stays fast.
required-features = ["app"]

[features]
default = []
# Compile the integration tests that spawn a real `ironclaw-reborn serve`.
# Mirrors `ic_integration_tests`: the binary must be built first, so a plain
# `cargo test --workspace` does not fail for a missing binary.
webui-v2-beta = []
app = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-global-shortcut",
    "dep:tauri-plugin-single-instance",
    "dep:tracing-subscriber",
]

[build-dependencies]
tauri-build = { version = "2", optional = true }

[dependencies]
ic_llama = { path = "../ic_llama" }
# The browser sidecar: the widget spawns it, and shares its manifest/tool
# catalogue so the extension id and tool names cannot drift between the two.
ic_browser_mcp = { path = "../ic_browser_mcp" }
# The canvas tool: served in-process, so the widget links it directly.
ic_canvas_mcp = { path = "../ic_canvas_mcp" }
# The voice pipeline: a library linked in (not a child), because it needs the
# AppHandle for lip-sync/state events and the tray mute, and the GatewayClient to
# send transcripts down the same chat path.
ic_voice = { path = "../ic_voice" }

tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-native-roots",
    "stream",
] }
futures-util = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4.3"
# Ambient guardrails: quiet hours are a *local* wall-clock question and the rate
# cap is an elapsed-time one, so both readings come from one chrono instant.
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "serde",
    "std",
] }
keyring = { version = "3", features = ["windows-native"] }
dirs = "6"
# The connector OAuth callback listener (Phase 8b.1): a widget-owned loopback
# server on a fixed port that proxies the redirect into `serve`. Same axum the
# canvas MCP already pulls in, so no new transitive weight.
axum = "0.8"
# Decode the OAuth `state`/`error` query params the same way the browser encoded
# them, for the CSRF check. Already compiled (axum uses it).
serde_urlencoded = "0.7"

tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
# Without a subscriber every `tracing` call in the app is discarded, which makes
# a misbehaving widget impossible to diagnose from a user's console.
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
], optional = true }
notify = "8.2.0"
# The frontmatter of an *imported* SKILL.md is real YAML, and the runtime parses
# it with this exact crate (`ironclaw_skills/src/parser.rs`). A hand-rolled line
# scanner refuses skills the runtime accepts — block scalars (`description: |-`)
# above all — so the import path uses the same parser rather than a lookalike.
# Pinned by `skill_parser_agreement.rs`, which feeds both the real thing.
serde_yml = "0.0.13"
# A temp directory for the cloned skills repo (Phase 8e), held in app state until
# an install copies from it. Also a dev-dependency for tests.
tempfile = "3"
# Cloning a git repo of skills (Phase 8e). Pure-Rust (no `git.exe` on the user's
# machine, no C toolchain) with the rustls HTTP transport, matching `reqwest`
# above. Used only for a depth-1, no-submodule shallow clone into a temp dir.
gix = { version = "0.73", default-features = false, features = [
    "blocking-http-transport-reqwest-rust-tls",
    "worktree-mutation",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    # The cursor poller behind the click-through mask: GetCursorPos,
    # GetForegroundWindow, and the monitor lookup for the fullscreen pause.
    "Win32_Graphics_Gdi",
    # `CreateJobObjectW` takes a SECURITY_ATTRIBUTES pointer, so the job-object
    # bindings are gated behind the security module.
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
ic_integration_tests = { path = "../ic_integration_tests" }
# Drive the OAuth callback router without a socket (Phase 8b.1), the same way
# the canvas/browser MCP tests drive theirs.
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
