[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # Pre-existing advisories — tracked for upgrade in separate PRs
    # serde_yml unsound/unmaintained — direct dep, upgrade tracked separately
    "RUSTSEC-2025-0068",
    # tokio-tar PAX header parsing — sandbox containers only
    "RUSTSEC-2025-0111",
    # rustls-webpki advisories — 0.102.8 remains pinned by a libsql 0.6.0 transitive dep
    # (via rustls 0.22 → hyper-rustls 0.25); keep ignored until that pin is gone.
    # RUSTSEC-2026-0104: panic on empty `onlySomeReasons` BIT STRING during CRL parsing.
    # We do not use CRLs, and the advisory explicitly notes apps that don't parse CRLs
    # are unaffected. Same transitive pin as 0049/0098/0099 — tracked with them.
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    # rand unsoundness with custom logger calling rand::rng() during reseed — we don't use this pattern;
    # revisit/remove by 2026-06-30, or when transitive deps (tower, nanoid, phf_generator) release rand ≥0.9.3 compat
    "RUSTSEC-2026-0097",
    # wasmtime: WASI path_open(TRUNCATE) bypasses FilePerms::WRITE host restriction
    # (https://github.com/bytecodealliance/wasmtime/security/advisories/GHSA-2r75-cxrj-cmph).
    # The IronClaw WASM sandbox does not grant guest modules WASI filesystem
    # capabilities backed by host-controlled FilePerms — guests communicate via
    # explicit host functions (see crates/ironclaw_engine and src/tools/wasm/host.rs),
    # so the TRUNCATE bypass is not reachable from our guest surface. Remove once
    # wasmtime is upgraded to a patched release.
    "RUSTSEC-2026-0149",

    # --- Desktop fork, triaged 2026-07-29 when `cargo deny` first became a CI
    # gate here. Each entry below records *why* it is not actionable now, not
    # merely that it is inconvenient. Three siblings found in the same run
    # (anyhow RUSTSEC-2026-0190, crossbeam-epoch RUSTSEC-2026-0204, and the
    # yanked spin 0.9.8) are absent from this list because they were fixed
    # rather than ignored — all three moved within semver.
    #
    # The four `not-shipped` entries rest on one checkable fact: the desktop app
    # ships and supervises `ironclaw_reborn_cli`, and
    # `cargo tree -p ironclaw_reborn_cli` contains none of lopdf, pdf-extract,
    # tokio-postgres, or postgres-protocol. They reach the workspace only
    # through the root `ironclaw` crate — the legacy v1 binary, which this fork
    # does not build or distribute. Re-check that with the command above before
    # trusting this note; it is the whole justification.

    # lopdf: stack overflow on deeply nested PDF objects. Pinned by
    # pdf-extract 0.7.12; no semver-compatible fix. Not shipped (see above), and
    # nothing in the fork parses PDFs.
    "RUSTSEC-2026-0187",
    # tokio-postgres / postgres-protocol: three denial-of-service advisories,
    # each requiring the process to actually speak the Postgres wire protocol to
    # a malicious or malformed peer. Not shipped (see above), and the desktop
    # profile is libSQL by design — `CLAUDE.md`'s storage decision is that a
    # desktop user must never need Postgres.
    "RUSTSEC-2026-0178",
    "RUSTSEC-2026-0179",
    "RUSTSEC-2026-0180",
    # wasmtime-wasi: unlike the four above, this one *is* in the shipped binary.
    # Both advisories are about the WASI filesystem surface — a descriptor leak
    # in `fd_renumber`, and hard link/rename escaping `FilePerms` on the
    # destination. Same reachability argument as RUSTSEC-2026-0149 immediately
    # above: IronClaw's WASM sandbox does not hand guest modules WASI filesystem
    # capabilities backed by host `FilePerms`; guests talk to the host through
    # explicit host functions. No semver-compatible fix — the patch is a
    # wasmtime major. Remove both with 0149 when wasmtime is upgraded.
    "RUSTSEC-2026-0182",
    "RUSTSEC-2026-0188",
]

[licenses]
version = 2
private = { ignore = true }
allow = [
    "MIT",
    # MIT-0 (MIT No Attribution) is strictly more permissive than MIT —
    # required by `jsonschema` (used for workspace document schema validation).
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# monty (Pydantic's embedded Python) is git-only (not on crates.io),
# so it inherently lacks a version constraint. Allow path-dep wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # Monty (Pydantic's embedded Python interpreter) — not yet on crates.io.
    # Pulls in ruff_* crates from astral-sh/ruff at a pinned revision.
    "https://github.com/pydantic/monty.git",
    "https://github.com/astral-sh/ruff.git",
]
